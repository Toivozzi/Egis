<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGIS!</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu" id="mainMenu">
        <button onclick="kaynnistaTarina()">Aloita Peli</button>
        <button onclick="avaaPaneeli('settings')">Asetukset</button>
        <button onclick="avaaPaneeli('credits')">Credits</button>
        <button onclick="poistuPelista()">Poistu Pelistä</button>
    </div>

    <div class="panel" id="credits">
        <button class="close" onclick="suljePaneelit()">×</button>
        <h2>Credits</h2>
        <p>Tekijät:</p>
        <p>Toivo</p>
        <p>Feeli</p>
        <p>Refresco Benelux</p>
        <p>NettiBrous</p>
    </div>

    <div class="panel" id="settings">
        <button class="close" onclick="suljePaneelit()">×</button>
        <h2>Asetukset</h2>

        <p>Musiikki</p>
        <button class="setting-button" id="musicToggle" onclick="vaihdaMusiikki()">
            Musiikki: POIS
        </button>

        <p>Hulluttt Äänieffektit</p>
        <button class="setting-button" id="effectsToggle" onclick="vaihdaEfektit()">
            Ääniefektit: PÄÄLLÄ :O
        </button>

        <p>VAIKEUSTASO</p>
        <button class="setting-button" id="difficultyToggle" onclick="vaihdaVaikeustasoa()">
            Vaikeustaso: Helppo
        </button>

        <p>Äänenvoimakkuus</p>
        <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="50"
            oninput="vaihdaAanenvoimakkuutta(this.value)"
        >
        <p id="volumeValue">50%</p>
    </div>

    <div id="story">
        <div class="story-box">
            <h1 id="sceneTitle"></h1>
            <p id="narration"></p>
            <button onclick="poistuTarinasta()">Päävalikko</button>
            <button onclick="ohitaKohtaus()">Skippaa</button>
        </div>
    </div>

    <div id="game">
        <div class="game-box">
            <h1>EGIS</h1>
            <p id="gameText" class="description">
                Eero on nyt huoneessaan, egis kädessään.
            </p>

            <div class="egis-area">
                <div class="can" id="can">EGIS</div>
                <button id="actionButton" onclick="pelitoiminto()">Avaa Egis</button>
                <button class="mini-button" onclick="oksennus()">Oksenna</button>
                <p id="gameStatus">Valmis?</p>
            </div>

            <div class="meters-panel">
                <h2>Desibelimittari</h2>
                <p id="noiseValue">Ääni: 0</p>
                <div class="meter">
                    <div class="bar" id="noiseBar"></div>
                </div>

                <h2>Nopeusmittari</h2>
                <p id="speedValue">Nopeus: 0</p>
                <div class="meter">
                    <div class="bar" id="speedBar"></div>
                </div>

                <h2>Edistyminen</h2>
                <div class="meter">
                    <div class="bar" id="progressBar"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="ending">
        <div class="ending-box">
            <h1 id="endingTitle"></h1>
            <p id="endingText" class="description"></p>
            <button onclick="aloitaPeliUudelleen()">Pelaa uudelleen</button>
            <br><br>
            <button onclick="poistuTarinasta()">Päävalikko</button>
        </div>
    </div>

    <div id="jumpscare">
        <img src="jumpscare.png" alt="">
    </div>

    <audio id="music" src="musiikki.mp3" loop preload="auto"></audio>
    <audio id="sceneSound" preload="auto"></audio>
    <audio id="egisSound" src="egis.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
